name: Weekly synthetic campaign

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and print only; do not write to Neon"
        type: boolean
        default: false
      seed:
        description: "Optional seed to reproduce a previous run"
        required: false

concurrency:
  group: weekly-campaign
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: "5432"
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: require
      NEON_DB_HOST: ${{ secrets.DB_HOST }}
      NEON_DB_NAME: ${{ secrets.DB_NAME }}
      NEON_DB_USER: ${{ secrets.DB_USER }}
      NEON_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt dbt-postgres

      - name: Generate campaign and load into Neon
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${{ inputs.seed }}" ]; then args+=(--seed "${{ inputs.seed }}"); fi
          python -m tools.synthetic_data_creation.campaign_generation "${args[@]}"

      - name: dbt build
        if: ${{ inputs.dry_run != true }}
        working-directory: marketing_analytics_dbt
        run: dbt build --target neon --profiles-dir ../.github/dbt
