version: 2

seeds:
  - name: campaign_goals
    description: >
      Planned objectives, offer, channel, budget and KPIs for each campaign.
      One row per campaign. Maintained by hand; the app adds this business
      context to every campaign, segment and insight answer.
    config:
      column_types:
        campaign_id: varchar(20)
        budget: numeric(12, 2)

    columns:
      - name: campaign_id
        description: Unique identifier for a campaign.
        data_tests:
          - unique
          - not_null

      - name: campaign_goal
        description: Business objective of the campaign.
        data_tests:
          - not_null

      - name: target_kpi
        description: Primary measure of campaign success.
        data_tests:
          - not_null

      - name: secondary_kpi
        description: Secondary measure used to evaluate efficiency and tradeoffs.

      - name: budget
        description: Planned campaign budget in dollars.
