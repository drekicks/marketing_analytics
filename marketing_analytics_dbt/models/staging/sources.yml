version: 2

sources:
  - name: dvdrental
    database: "{{ target.database }}"
    schema: "{{ 'RAW' if target.type == 'snowflake' else 'public' }}"

    tables:
      - name: customer
      - name: rental
      - name: payment
      - name: campaign_results
      - name: customer_segment
      - name: address
      - name: campaign_goals
        description: One row per campaign; written by tools/synthetic_data_creation/campaign_generation.py.
